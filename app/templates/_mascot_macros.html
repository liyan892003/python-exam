{# IP 吉祥物：小蛇「派派」——Python 练习乐园的学习伙伴。
   snake(size=40, bounce=False)：bounce 时上下摆动（用于当前关卡）。 #}
{% macro snake(size=40, bounce=False) %}
<span class="inline-block {% if bounce %}walker{% endif %}" style="width:{{size}}px;height:{{size}}px">
  <svg viewBox="0 0 64 64" width="{{size}}" height="{{size}}">
    <defs>
      <linearGradient id="snakeBody" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#16a34a"/>
      </linearGradient>
      <linearGradient id="snakeHead" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#bbf7d0"/><stop offset=".55" stop-color="#4ade80"/><stop offset="1" stop-color="#22c55e"/>
      </linearGradient>
    </defs>
    <!-- S 形身体 -->
    <path d="M20 60 C 6 48, 50 50, 46 34 C 43 22, 18 27, 26 15"
          fill="none" stroke="url(#snakeBody)" stroke-width="12"
          stroke-linecap="round"/>
    <!-- 身体花纹 -->
    <circle cx="24" cy="52" r="2.4" fill="#15803d" opacity=".55"/>
    <circle cx="40" cy="42" r="2.4" fill="#15803d" opacity=".55"/>
    <circle cx="30" cy="28" r="2.4" fill="#15803d" opacity=".55"/>
    <!-- 头 -->
    <circle cx="28" cy="13" r="12.5" fill="url(#snakeHead)" stroke="#15803d" stroke-width="1.6"/>
    <!-- 腮红 -->
    <circle cx="19.5" cy="16" r="2.4" fill="#fb7185" opacity=".55"/>
    <circle cx="36.5" cy="16" r="2.4" fill="#fb7185" opacity=".55"/>
    <!-- 眼睛 -->
    <circle cx="23.5" cy="10.5" r="3.4" fill="#fff"/>
    <circle cx="32.5" cy="10.5" r="3.4" fill="#fff"/>
    <circle cx="24.3" cy="11" r="1.8" fill="#0f172a"/>
    <circle cx="33.3" cy="11" r="1.8" fill="#0f172a"/>
    <circle cx="25" cy="10.3" r=".6" fill="#fff"/>
    <circle cx="34" cy="10.3" r=".6" fill="#fff"/>
    <!-- 微笑 -->
    <path d="M24 17 Q28 20.5 32 17" fill="none" stroke="#14532d" stroke-width="1.6" stroke-linecap="round"/>
    <!-- 吐信子 -->
    <path d="M28 19.5 V24 M28 24 l-3 3 M28 24 l3 3" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
</span>
{% endmacro %}
