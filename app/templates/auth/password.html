{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <div class="bg-white/85 rounded-4xl p-8 shadow-xl">
    <div class="text-center mb-6">
      <div class="text-5xl mb-2">🔐</div>
      <h1 class="text-2xl font-extrabold text-candy-500">修改密码</h1>
      <p class="text-sm text-slate-400 mt-1">{{ user.username }}（{{ user.email }}）</p>
    </div>

    {% if ok %}
    <div class="bg-green-50 border-2 border-green-200 text-green-600 px-4 py-3 rounded-2xl mb-4 text-sm font-bold">
      ✅ 密码修改成功，下次登录请使用新密码
    </div>
    {% endif %}
    {% if error %}
    <div class="bg-red-50 border-2 border-red-200 text-red-500 px-4 py-3 rounded-2xl mb-4 text-sm font-bold animate-shake">⚠️ {{ error }}</div>
    {% endif %}

    <form method="post" action="/account/password" class="space-y-4">
      <div>
        <label class="block text-sm font-bold text-slate-500 mb-1">当前密码</label>
        <input type="password" name="old_password" required
               class="w-full px-4 py-3 rounded-2xl border-2 border-candy-100 focus:border-candy-400 outline-none transition bg-candy-50/50"
               placeholder="你现在的密码">
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-500 mb-1">新密码（至少 6 位）</label>
        <input type="password" name="new_password" required minlength="6"
               class="w-full px-4 py-3 rounded-2xl border-2 border-candy-100 focus:border-candy-400 outline-none transition bg-candy-50/50"
               placeholder="设置新密码">
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-500 mb-1">确认新密码</label>
        <input type="password" name="confirm" required minlength="6"
               class="w-full px-4 py-3 rounded-2xl border-2 border-candy-100 focus:border-candy-400 outline-none transition bg-candy-50/50"
               placeholder="再输入一遍">
      </div>
      <button class="w-full py-3 rounded-2xl bg-candy-400 text-white font-bold text-lg shadow-lg hover:bg-candy-500 hover:scale-[1.02] transition transform">
        保存新密码 🔑
      </button>
    </form>
    <p class="text-center text-sm mt-4">
      <a href="{{ '/teacher' if user.role.value == 'teacher' else '/student' }}" class="text-slate-400 hover:text-candy-400 font-bold">← 返回中心</a>
    </p>
  </div>
</div>
{% endblock %}
