{% extends "base.html" %}
{% block title %}注册{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <div class="bg-white/85 rounded-4xl p-8 shadow-xl">
    <div class="text-center mb-6">
      <div class="text-5xl mb-2">🎉</div>
      <h1 class="text-3xl font-extrabold text-candy-500">加入乐园</h1>
      <p class="text-slate-400 text-sm">注册你的账号开始练习吧</p>
    </div>
    {% if error %}
      <div class="bg-red-50 border-2 border-red-200 text-red-500 px-4 py-3 rounded-2xl mb-4 text-sm font-bold animate-shake">⚠️ {{ error }}</div>
    {% endif %}
    <form method="post" action="/register" class="space-y-4">
      <div>
        <label class="block text-sm font-bold text-slate-500 mb-1">昵称</label>
        <input type="text" name="username" required
               class="w-full px-4 py-3 rounded-2xl border-2 border-candy-100 focus:border-candy-400 outline-none transition bg-candy-50/50"
               placeholder="你的昵称">
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-500 mb-1">学号 / 工号（纯数字）</label>
        <input type="text" name="email" required inputmode="numeric" pattern="\d{3,}"
               class="w-full px-4 py-3 rounded-2xl border-2 border-candy-100 focus:border-candy-400 outline-none transition bg-candy-50/50"
               placeholder="如：20231001">
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-500 mb-1">密码</label>
        <input type="password" name="password" required
               class="w-full px-4 py-3 rounded-2xl border-2 border-candy-100 focus:border-candy-400 outline-none transition bg-candy-50/50"
               placeholder="至少 6 位">
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-500 mb-1">我是…</label>
        <div class="flex gap-3">
          <label class="flex-1 cursor-pointer">
            <input type="radio" name="role" value="student" class="peer hidden" checked>
            <div class="px-4 py-3 rounded-2xl border-2 border-candy-100 text-center peer-checked:border-candy-400 peer-checked:bg-candy-50 transition">🎒 学生</div>
          </label>
          <label class="flex-1 cursor-pointer">
            <input type="radio" name="role" value="teacher" class="peer hidden">
            <div class="px-4 py-3 rounded-2xl border-2 border-candy-100 text-center peer-checked:border-candy-400 peer-checked:bg-candy-50 transition">👩‍🏫 老师</div>
          </label>
        </div>
      </div>
      <button class="w-full py-3 rounded-2xl bg-candy-400 text-white font-bold text-lg shadow-lg hover:bg-candy-500 hover:scale-[1.02] transition transform">
        注册 🚀
      </button>
    </form>
    <p class="text-center text-sm text-slate-400 mt-4">已有账号？<a href="/login" class="text-candy-500 font-bold">去登录</a></p>
  </div>
</div>
{% endblock %}
