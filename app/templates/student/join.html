{% extends "base.html" %}
{% block title %}加入班级{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <div class="bg-white/85 rounded-4xl p-8 shadow-xl text-center">
    <div class="text-5xl mb-3">🔑</div>
    <h1 class="text-3xl font-extrabold text-candy-500 mb-2">加入班级</h1>
    <p class="text-slate-400 text-sm mb-6">向老师要 6 位邀请码</p>
    {% if error %}
      <div class="bg-red-50 border-2 border-red-200 text-red-500 px-4 py-3 rounded-2xl mb-4 text-sm font-bold animate-shake">⚠️ {{ error }}</div>
    {% endif %}
    <form method="post" action="/student/join" class="space-y-4">
      <input type="text" name="code" required maxlength="6"
             class="w-full text-center text-3xl font-mono font-extrabold tracking-[0.5em] uppercase px-4 py-4 rounded-2xl border-4 border-candy-200 focus:border-candy-400 outline-none transition bg-candy-50/50"
             placeholder="ABC123">
      <button class="w-full py-3 rounded-2xl bg-candy-400 text-white font-bold text-lg shadow-lg hover:bg-candy-500 hover:scale-[1.02] transition transform">
        加入 🚪
      </button>
    </form>
    <a href="/student" class="block text-sm text-slate-400 mt-4 hover:text-candy-400">← 返回</a>
  </div>
</div>
{% endblock %}
